name: Linux ARM64 CI

on:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: linux-arm64-ci-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: ubuntu-24.04-arm Release
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libboost-all-dev libtbb-dev ninja-build

      - name: Set up persistent compiler cache
        id: compiler-cache
        uses: ./.github/actions/compiler-cache
        with:
          lane: native-ubuntu-24.04-arm
          build-type: Release

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DGTSAM_BUILD_WITH_WERROR=ON \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_FLAGS="-w" \
            -DGTSAM_BUILD_TESTS=ON \
            -DGTSAM_BUILD_UNSTABLE=OFF \
            -DGTSAM_BUILD_EXAMPLES_ALWAYS=OFF \
            -DGTSAM_BUILD_WITH_MARCH_NATIVE=OFF \
            -DGTSAM_WITH_TBB=OFF \
            -DGTSAM_USE_BOOST_FEATURES=OFF \
            -DGTSAM_ENABLE_BOOST_SERIALIZATION=OFF

      - name: Build
        run: bash .github/scripts/timed.sh Build cmake --build build --target all.tests --parallel 2

      - name: Test
        run: bash .github/scripts/timed.sh Test cmake --build build --target check --parallel 2

      - name: Report and save compiler cache
        if: always() && steps.compiler-cache.outcome == 'success'
        uses: ./.github/actions/compiler-cache
        with:
          operation: finish
          lane: native-ubuntu-24.04-arm
          build-type: Release
          successful: ${{ job.status == 'success' }}
