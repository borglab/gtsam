# This file was initialized with `myst init --gh-pages`

name: MyST GitHub Pages Deploy
on:
  push:
    # Runs on pushes targeting the develop branch
    branches: [develop]
    # Only trigger redeploy if documentation source or config changes
    paths:
      - '**.md'
      - '**.ipynb'
      - '**.css'
      - 'doc/images/gtsam-manifold-optimization-*.png'
      - 'myst.yml'
env:
  # `BASE_URL` determines the website is served from, including CSS & JS assets
  # You may need to change this to `BASE_URL: ''`
  BASE_URL: /${{ github.event.repository.name }}

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write
# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: 'pages'
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.x
      - name: Install MyST Markdown
        run: npm install -g mystmd
      - name: Build HTML Assets
        run: myst build --html
      - name: Copy theme-aware splash image
        run: cp doc/images/gtsam-manifold-optimization-dark.png _build/html/
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: './_build/html'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
