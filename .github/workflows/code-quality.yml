name: Code quality

on:
  workflow_call:
    outputs:
      build_changes:
        description: Changes include files covered by the CI build matrix
        value: ${{ jobs.clang-tidy.outputs.build_changes }}
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-checks:
    name: GTSAM source conventions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Test quality checker
        run: python3 -m unittest discover -s scripts -p test_code_quality.py
      - name: Check source conventions
        run: python3 scripts/check_code_quality.py

  clang-tidy:
    name: Clang-Tidy (changed C++ lines)
    outputs:
      build_changes: ${{ steps.diff.outputs.build_changes }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - name: Identify build and Clang-Tidy changes
        id: diff
        env:
          PUSH_BASE: ${{ github.event.before }}
        run: |
          # PR checkout is a merge commit. For a multi-commit push, compare the
          # whole push. Manual and nightly runs check the tip against its parent.
          base=HEAD^1
          if [[ "$GITHUB_EVENT_NAME" == push && "$PUSH_BASE" != 0000000000000000000000000000000000000000 ]]; then
            base=$PUSH_BASE
            if ! git cat-file -e "$base^{commit}"; then
              git fetch --no-tags --depth=1 origin "$base"
            fi
          fi
          git diff --name-only --no-renames "$base" HEAD -- . \
            ':(exclude,glob)**/*.md' ':(exclude,glob)**/*.ipynb' ':(exclude,top)myst.yml' \
            > "$RUNNER_TEMP/build-changes"
          if [[ -s "$RUNNER_TEMP/build-changes" ]]; then
            echo 'build_changes=true' >> "$GITHUB_OUTPUT"
          fi
          git diff --no-ext-diff --no-color --unified=0 --diff-filter=AMR \
            "$base" HEAD -- ':(glob)**/*.cpp' \
            ':(exclude)gtsam/3rdparty' ':(exclude)wrap' \
            ':(exclude)CppUnitLite' > "$RUNNER_TEMP/clang-tidy.diff"
          if [[ -s "$RUNNER_TEMP/clang-tidy.diff" ]]; then
            echo 'has_changes=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Install Clang-Tidy
        if: steps.diff.outputs.has_changes == 'true'
        run: |
          python3 -m venv "$RUNNER_TEMP/clang-tidy"
          "$RUNNER_TEMP/clang-tidy/bin/pip" install clang-tidy==23.1.4
          echo "$RUNNER_TEMP/clang-tidy/bin" >> "$GITHUB_PATH"
      - name: Generate compilation database
        if: steps.diff.outputs.has_changes == 'true'
        run: >-
          cmake -S . -B build-tidy -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          -DGTSAM_BUILD_TESTS=ON -DGTSAM_BUILD_EXAMPLES_ALWAYS=ON
          -DGTSAM_BUILD_UNSTABLE=ON -DGTSAM_WITH_TBB=OFF
          -DGTSAM_USE_BOOST_FEATURES=OFF -DGTSAM_ENABLE_BOOST_SERIALIZATION=OFF
          -DGTSAM_ALLOW_DEPRECATED_SINCE_V43=OFF
      - name: Check changed lines
        if: steps.diff.outputs.has_changes == 'true'
        run: |
          clang-tidy-diff.py -p1 -path build-tidy -j 2 -quiet \
            -regex '.*\.cpp' -only-check-in-db -warnings-as-errors '*' \
            < "$RUNNER_TEMP/clang-tidy.diff"
