name: Conda build
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  reproduce:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          pixi-version: v0.81.0
          run-install: false
      - name: Download the original Windows package
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 38047493267 --repo borglab/gtsam --name conda-package-win-64 --dir baseline
      - name: Reproduce the installed Python import failure
        shell: bash
        run: |
          package=$(echo baseline/gtsam-*.conda)
          pixi exec --spec "$package" -- python -I -c '
          import os, pathlib, sys, sysconfig
          os.chdir(os.environ["RUNNER_TEMP"])
          print("Python:", sys.version)
          print("Prefix:", sys.prefix)
          print("Expected site-packages:", sysconfig.get_path("platlib"))
          installed = list(pathlib.Path(sys.prefix).glob("Library/**/gtsam/__init__.py"))
          print("Packaged gtsam location:", installed)
          assert installed, "Original misplaced package was not found"
          try:
              import gtsam
          except ModuleNotFoundError as error:
              assert error.name == "gtsam", error
              print("Reproduced:", repr(error))
          else:
              raise AssertionError("Original package unexpectedly imports")
          '
