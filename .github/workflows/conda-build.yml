name: Conda build

# Temporary native measurements; excluded from the proposed PR.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  measure:
    name: Native Windows development
    runs-on: windows-latest
    timeout-minutes: 350
    env:
      SCCACHE_DIR: ${{ github.workspace }}/.sccache
      SCCACHE_CACHE_SIZE: 1G
      SCCACHE_IDLE_TIMEOUT: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          pixi-version: v0.81.0
          environments: test
          cache: true
      - name: Native cold and warm builds with identical dependencies
        run: pixi run -e test python scripts/measure_conda_cache.py development
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: windows-cache-development
          path: measurements/
          if-no-files-found: error
