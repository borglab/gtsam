name: Conda build

# Temporary package regression check; excluded from the proposed PR.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          pixi-version: v0.81.0
          environments: test
          cache: true
      - name: Build the conda package
        id: package
        run: pixi build --path pixi.toml --output-dir dist
      - name: Test the installed conda package
        shell: bash
        run: |
          # Expand CONDA_PREFIX inside the consumer environment.
          # shellcheck disable=SC2016
          pixi exec \
            --spec dist/gtsam-*.conda \
            --spec cmake \
            --spec ninja \
            --spec cxx-compiler \
            --spec eigen \
            --spec libboost-devel \
            --spec tbb-devel \
            --spec pytest \
            -- bash -c '
              set -e
              prefix_path="$CONDA_PREFIX"
              if [[ "$RUNNER_OS" == "Windows" ]]; then
                prefix_path="$CONDA_PREFIX/Library"
              fi
              python -I scripts/test_conda_package.py
              cmake -G Ninja -S cmake/example_cmake_find_gtsam -B build-example \
                -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$prefix_path"
              cmake --build build-example
              ./build-example/example
            '

      - uses: actions/upload-artifact@v7
        if: always() && steps.package.outcome == 'success'
        with:
          name: macos-arm-serialization-package
          path: dist/*.conda
          if-no-files-found: error
