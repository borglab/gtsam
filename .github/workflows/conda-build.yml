name: Conda build

# Temporary diagnosis of the original artifact, not part of the proposed PR.
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  layout:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          pixi-version: v0.81.0
          run-install: false
      - name: Download the original Windows artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 38047493267 --repo borglab/gtsam --name conda-package-win-64 --dir baseline
      - name: Confirm the failure and test the corrected location
        shell: bash
        run: |
          package=$(echo baseline/gtsam-*.conda)
          pixi exec --spec "$package" --spec pytest -- python -I scripts/probe_conda_layout.py
