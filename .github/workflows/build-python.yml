name: Python CI

# Documentation-only changes are excluded at the trigger level, so neither the
# fast compilation gate nor the Python matrix consumes a runner for those PRs.
on:
  push:
    branches:
      - develop
    paths-ignore:
      - "**.md"
      - "**.ipynb"
      - "myst.yml"
  workflow_dispatch:
    inputs:
      runner:
        description: Runner selection
        required: true
        default: all
        type: choice
        options:
          - all
          - windows-2022-msvc
  pull_request:
    paths-ignore:
      - "**.md"
      - "**.ipynb"
      - "myst.yml"

# Every time you make a push to your PR, it cancel immediately the previous checks,
# and start a new one. The other runner will be available more quickly to your PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  # Check paths of changed files to see if any are non-ignored.
  check-paths:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.filter.outputs.relevant_changes }}
      build_matrix: ${{ steps.matrix.outputs.build_matrix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Check modified files
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            relevant_changes:
              - '!**.md'
              - '!**.ipynb' 
              - '!myst.yml'

      - name: Configure build matrix
        id: matrix
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          RUNNER_SELECTION: ${{ inputs.runner || 'all' }}
        run: |
          if [ "$EVENT_NAME" = "push" ] || [ "$RUNNER_SELECTION" = "windows-2022-msvc" ]; then
            echo 'build_matrix={"include":[{"name":"windows-2022-msvc","build_type":"Release","python_version":3,"os":"windows-2022","platform":64}]}' >> "$GITHUB_OUTPUT"
          else
            echo 'build_matrix={"include":[{"name":"ubuntu-22.04-gcc-11","build_type":"Release","python_version":3,"os":"ubuntu-22.04","compiler":"gcc","version":"11"},{"name":"ubuntu-22.04-gcc-11-noboost","build_type":"Release","python_version":3,"os":"ubuntu-22.04","compiler":"gcc","version":"11"},{"name":"ubuntu-22.04-clang-11","build_type":"Release","python_version":3,"os":"ubuntu-22.04","compiler":"clang","version":"11"},{"name":"macos-15-xcode-16","build_type":"Release","python_version":3,"os":"macos-15","compiler":"xcode","version":"16"},{"name":"windows-2022-msvc","build_type":"Release","python_version":3,"os":"windows-2022","platform":64}]}' >> "$GITHUB_OUTPUT"
          fi

  fast-compile:
    name: Fast compile (${{ matrix.name }})
    needs: check-paths
    if: github.event_name == 'pull_request' && needs.check-paths.outputs.should_run == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
          - name: Windows
            os: windows-latest
          - name: macOS
            os: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure
        shell: bash
        run: >-
          cmake -S . -B build-fast -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DGTSAM_BUILD_TESTS=OFF
          -DGTSAM_BUILD_UNSTABLE=OFF
          -DGTSAM_UNSTABLE_BUILD_PYTHON=OFF
          -DGTSAM_BUILD_EXAMPLES_ALWAYS=OFF
          -DGTSAM_BUILD_TIMING_ALWAYS=OFF
          -DGTSAM_BUILD_DOCS=OFF
          -DGTSAM_BUILD_PYTHON=OFF
          -DGTSAM_INSTALL_MATLAB_TOOLBOX=OFF
          -DGTSAM_WITH_TBB=OFF
          -DGTSAM_USE_BOOST_FEATURES=OFF
          -DGTSAM_ENABLE_BOOST_SERIALIZATION=OFF
          -DGTSAM_ENABLE_GEOGRAPHICLIB=OFF
          -DGTSAM_BUILD_WITH_MARCH_NATIVE=OFF

      - name: Compile gtsam
        run: cmake --build build-fast --target gtsam --parallel 4

  build:
    # On PRs, create all existing required contexts even if the fast gate fails.
    # Their first step reports the gate failure; expensive setup never starts.
    needs: [check-paths, fast-compile]
    if: >-
      always() &&
      (github.event_name == 'workflow_dispatch' ||
       github.event_name == 'push' ||
       needs.check-paths.outputs.should_run == 'true')

    name: ${{ matrix.name }} ${{ matrix.build_type }} Python ${{ matrix.python_version }}
    runs-on: ${{ matrix.os }}

    env:
      CTEST_OUTPUT_ON_FAILURE: ON
      CTEST_PARALLEL_LEVEL: 2
      CMAKE_BUILD_TYPE: ${{ matrix.build_type }}
      PYTHON_VERSION: ${{ matrix.python_version }}
      SCCACHE_GHA_ENABLED: ON

    strategy:
      # Preserve fail-fast for normal Python CI, but let every required context
      # report a failed fast gate instead of being cancelled by a sibling.
      fail-fast: >-
        ${{ github.event_name != 'pull_request' ||
            needs.fast-compile.result == 'success' }}
      matrix: ${{ fromJSON(needs.check-paths.outputs.build_matrix) }}

    steps:
      - name: Require successful fast compilation
        if: github.event_name == 'pull_request' && needs.fast-compile.result != 'success'
        shell: bash
        run: |
          echo "Fast compilation did not succeed (result: ${{ needs.fast-compile.result }})."
          exit 1

      - name: Checkout
        uses: actions/checkout@v6

      - name: Install (Linux)
        if: runner.os == 'Linux'
        run: |
          if [ "${{ matrix.compiler }}" = "clang" ] && [ "${{ matrix.version }}" = "9" ]; then
            # (ipv4|ha).pool.sks-keyservers.net is the SKS GPG global keyserver pool
            # ipv4 avoids potential timeouts because of crappy IPv6 infrastructure
            # 15CF4D18AF4F7421 is the GPG key for the LLVM apt repository
            # This key is not in the keystore by default for Ubuntu so we need to add it.
            LLVM_KEY=15CF4D18AF4F7421
            gpg --keyserver keyserver.ubuntu.com --recv-key $LLVM_KEY || gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-key $LLVM_KEY
            gpg -a --export $LLVM_KEY | sudo apt-key add -
            sudo add-apt-repository "deb http://apt.llvm.org/bionic/ llvm-toolchain-bionic-9 main"
          fi

          sudo apt-get -y update
          if [ "${{ matrix.name }}" = "ubuntu-22.04-gcc-11-noboost" ]; then
            sudo apt-get -y install build-essential pkg-config libpython3-dev python3-numpy
          else
            sudo apt-get -y install build-essential pkg-config libpython3-dev python3-numpy libboost-all-dev
          fi

          if [ "${{ matrix.compiler }}" = "gcc" ]; then
            sudo apt-get install -y g++-${{ matrix.version }} g++-${{ matrix.version }}-multilib
            echo "CC=gcc-${{ matrix.version }}" >> $GITHUB_ENV
            echo "CXX=g++-${{ matrix.version }}" >> $GITHUB_ENV
          else
            sudo apt-get install -y clang-${{ matrix.version }} g++-multilib
            echo "CC=clang-${{ matrix.version }}" >> $GITHUB_ENV
            echo "CXX=clang++-${{ matrix.version }}" >> $GITHUB_ENV
          fi

      - name: Install (macOS)
        if: runner.os == 'macOS'
        run: |
          brew update
          # Install boost only if missing
          brew list boost >/dev/null 2>&1 || brew install boost
          sudo xcode-select -switch /Applications/Xcode.app
          echo "CC=clang" >> $GITHUB_ENV
          echo "CXX=clang++" >> $GITHUB_ENV

      - name: Setup MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x${{matrix.platform}}
          toolset: 14.40

      - name: cl version (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: cl

      - name: Setup python (Windows)
        uses: actions/setup-python@v5
        if: runner.os == 'Windows'
        with:
          python-version: ${{ matrix.python_version }}

      - name: Install Boost (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          choco install boost-msvc-14.2 --yes --no-progress

          # Try common Chocolatey install roots for Boost
          $candidates = @(
            "C:\local\boost_*",
            "C:\ProgramData\chocolatey\lib\boost-msvc-14.2\tools\boost_*",
            "C:\ProgramData\chocolatey\lib\boost-msvc-14.2\**\boost_*"
          )

          $boostRoot = $null
          foreach ($pattern in $candidates) {
            $match = Get-ChildItem -Path $pattern -Directory -ErrorAction SilentlyContinue |
              Sort-Object FullName -Descending |
              Select-Object -First 1
            if ($match) { $boostRoot = $match.FullName; break }
          }

          if (-not $boostRoot) {
            throw "Boost installed but root directory was not found in expected locations."
          }

          $versionHeaderPath = Join-Path $boostRoot "boost\version.hpp"
          if (Test-Path $versionHeaderPath -PathType Leaf) {
            $versionHeader = Get-Item $versionHeaderPath
          } else {
            $versionHeaders = @(Get-ChildItem -Path $boostRoot -Filter version.hpp -File -Recurse |
              Where-Object { $_.FullName -match '[\\/]boost[\\/]version\.hpp$' })
            if ($versionHeaders.Count -ne 1) {
              throw "Expected one Boost version header under $boostRoot; found $($versionHeaders.Count)."
            }
            $versionHeader = $versionHeaders[0]
          }
          $boostIncludeDir = Split-Path -Parent (Split-Path -Parent $versionHeader.FullName)

          $boostLibraryDir = Join-Path $boostRoot "lib64-msvc-14.2"
          if (-not (Test-Path $boostLibraryDir -PathType Container)) {
            $libraryDirs = @(Get-ChildItem -Path $boostRoot -Filter "lib64-msvc-*" -Directory)
            if ($libraryDirs.Count -ne 1) {
              throw "Expected one x64 MSVC Boost library directory under $boostRoot; found $($libraryDirs.Count)."
            }
            $boostLibraryDir = $libraryDirs[0].FullName
          }

          $requiredComponents = @("chrono", "graph", "program_options", "random", "serialization", "timer")
          foreach ($component in $requiredComponents) {
            $componentLibrary = Get-ChildItem -Path $boostLibraryDir -Filter "libboost_$component-*-x64-*.lib" -File |
              Select-Object -First 1
            if (-not $componentLibrary) {
              throw "Boost $component x64 library was not found in $boostLibraryDir."
            }
          }

          "BOOST_ROOT=$boostRoot" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "BOOST_INCLUDEDIR=$boostIncludeDir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "BOOST_LIBRARYDIR=$boostLibraryDir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Using BOOST_ROOT=$boostRoot"
          Write-Host "Using BOOST_INCLUDEDIR=$boostIncludeDir"
          Write-Host "Using BOOST_LIBRARYDIR=$boostLibraryDir"
    
      - name: Install sccache
        if: runner.os == 'Windows'
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Set GTSAM_WITH_TBB Flag
        if: matrix.flag == 'tbb'
        run: |
          echo "GTSAM_WITH_TBB=ON" >> $GITHUB_ENV
          echo "GTSAM Uses TBB"

      - name: Set Swap Space (Linux)
        if: runner.os == 'Linux'
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 6

      - name: Install System Dependencies (Linux, macOS)
        if: runner.os != 'Windows'
        run: |
          bash .github/scripts/python.sh -d

      - name: Create virtual on MacOS
        if: runner.os == 'macOS'
        run: |
          python$PYTHON_VERSION -m venv venv
          source venv/bin/activate
          echo "PATH=$(pwd)/venv/bin:$PATH" >> $GITHUB_ENV
          python -m pip install --upgrade pip

      - name: Install Python Dependencies
        shell: bash
        run: python$PYTHON_VERSION -m pip install -r python/dev_requirements.txt

      - name: Build
        shell: bash
        if: matrix.name != 'ubuntu-22.04-gcc-11-noboost' && matrix.name != 'windows-2022-msvc'
        run: |
          bash .github/scripts/python.sh -b

      - name: Build
        shell: bash
        if: matrix.name == 'windows-2022-msvc'
        env:
          BUILD_JOBS: 3
        run: |
          bash .github/scripts/python.sh -b --sccache

      - name: Build (No Boost Wrapper Check)
        if: matrix.name == 'ubuntu-22.04-gcc-11-noboost'
        shell: bash
        run: |
          bash .github/scripts/python.sh -b --no-boost

      - name: Test
        shell: bash
        if: matrix.name != 'ubuntu-22.04-gcc-11-noboost'
        run: |
          bash .github/scripts/python.sh -t

      - name: Test (No Boost Wrapper Check)
        if: matrix.name == 'ubuntu-22.04-gcc-11-noboost'
        shell: bash
        run: |
          bash .github/scripts/python.sh -t --no-boost
