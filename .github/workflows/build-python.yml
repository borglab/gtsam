name: Python CI

on: [pull_request]

jobs:
  build:
    name: ${{ matrix.name }} ${{ matrix.build_type }} Python ${{ matrix.python_version }}
    runs-on: ${{ matrix.os }}

    env:
      CTEST_OUTPUT_ON_FAILURE: ON
      CTEST_PARALLEL_LEVEL: 2
      CMAKE_BUILD_TYPE: ${{ matrix.build_type }}
      PYTHON_VERSION: ${{ matrix.python_version }}

    strategy:
      fail-fast: false
      matrix:
        # Github Actions requires a single row to be added to the build matrix.
        # See https://help.github.com/en/articles/workflow-syntax-for-github-actions.
        name: [
          ubuntu-24.04-gcc-13,
          ubuntu-24.04-clang-16,
          macos-15-intel-xcode-16,
          ubuntu-24.04-gcc-13-tbb,
        ]

        build_type: [Debug, Release]
        python_version: [3]
        include:
          - name: ubuntu-24.04-gcc-13
            os: ubuntu-24.04
            compiler: gcc
            version: "13"

          - name: ubuntu-24.04-clang-16
            os: ubuntu-24.04
            compiler: clang
            version: "16"

          # NOTE temporarily added this as it is a required check.
          - name: ubuntu-24.04-clang-16
            os: ubuntu-24.04
            compiler: clang
            version: "16"
            build_type: Debug
            python_version: "3"

          - name: macos-15-intel-xcode-16
            os: macos-15-intel
            compiler: xcode
            version: "16"

          - name: ubuntu-24.04-gcc-13-tbb
            os: ubuntu-24.04
            compiler: gcc
            version: "13"
            flag: tbb

    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get -y update
          sudo apt-get -y install cmake build-essential pkg-config libpython3-dev python3-numpy libboost-all-dev
          
          if [ "${{ matrix.compiler }}" = "gcc" ]; then
            sudo apt-get install -y g++-${{ matrix.version }} g++-${{ matrix.version }}-multilib
            echo "CC=gcc-${{ matrix.version }}" >> $GITHUB_ENV
            echo "CXX=g++-${{ matrix.version }}" >> $GITHUB_ENV
          else
            sudo apt-get install -y clang-${{ matrix.version }} g++-multilib
            echo "CC=clang-${{ matrix.version }}" >> $GITHUB_ENV
            echo "CXX=clang++-${{ matrix.version }}" >> $GITHUB_ENV
          fi
      - name: Install (macOS)
        if: runner.os == 'macOS'
        run: |
          brew update
          brew list boost &>/dev/null || brew install boost
          sudo xcode-select -switch /Applications/Xcode.app
          echo "CC=clang" >> $GITHUB_ENV
          echo "CXX=clang++" >> $GITHUB_ENV
          echo "CMAKE_POLICY_VERSION_MINIMUM=3.5" >> $GITHUB_ENV

          python3 -m venv "$RUNNER_TEMP/gtsam-venv"
          echo "VIRTUAL_ENV=$RUNNER_TEMP/gtsam-venv" >> $GITHUB_ENV
          echo "$RUNNER_TEMP/gtsam-venv/bin" >> $GITHUB_PATH
      - name: Set GTSAM_WITH_TBB Flag
        if: matrix.flag == 'tbb'
        run: |
          echo "GTSAM_WITH_TBB=ON" >> $GITHUB_ENV
          echo "GTSAM Uses TBB"
      - name: Set Swap Space
        if: runner.os == 'Linux'
        uses: pierotofy/set-swap-space@fc79b3f67fa8a838184ce84a674ca12238d2c761
        with:
          swap-size-gb: 6
      - name: Install Dependencies
        run: |
          bash .github/scripts/python.sh -d
      - name: Build
        run: |
          bash .github/scripts/python.sh -b
      - name: Test
        run: |
          bash .github/scripts/python.sh -t
